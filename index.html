<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance Snapshots</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Yahoo Finance snapshots</p>
        <h1>Finance Snapshots</h1>
      </div>
      <button id="printBtn" type="button" aria-label="Export all snapshots as PDF">PDF all</button>
    </header>

    <main>
      <section class="overview" aria-label="Overview">
        <div>
          <span class="label">Source</span>
          <strong id="source">Yahoo Finance</strong>
        </div>
        <div>
          <span class="label">Last updated</span>
          <strong id="updated">Loading...</strong>
        </div>
        <div>
          <span class="label">Universe</span>
          <div id="universeControls" class="universe-controls">Loading...</div>
        </div>
      </section>

      <section id="assetGroups" class="asset-groups" aria-label="Asset tables"></section>

      <section id="companies" class="companies" aria-live="polite"></section>
    </main>

    <footer>
      Data provided via Yahoo Finance / yfinance. Educational analysis only, not financial advice.
    </footer>

    <script src="assets/app.js"></script>
  </body>
</html>
